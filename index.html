<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حقيبة القدرات (27) - أ/ عبدالعزيز الفيفي</title>
    <style>
        :root { 
            --primary: #273c75;   /* أزرق فولاذي */
            --secondary: #353b48; /* رمادي داكن */
            --accent: #d4af37;    /* ذهبي مطفي */
            --bg: #f5f6fa; 
            --white: #ffffff; 
            --correct: #2e7d32;
            --wrong: #c62828;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); display: flex; justify-content: center; padding: 20px; line-height: 1.7; color: #2f3640; }
        .quiz-card { background: var(--white); width: 100%; max-width: 950px; border-radius: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); border-top: 15px solid var(--primary); padding: 30px; position: relative; }
        .header { text-align: center; border-bottom: 2px solid #eee; margin-bottom: 25px; padding-bottom: 15px; }
        
        .timer-container { 
            position: sticky; top: 10px; background: var(--secondary); color: white; padding: 10px 25px; 
            border-radius: 50px; font-weight: bold; font-size: 1.1rem; display: inline-block; 
            margin-bottom: 20px; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: all 0.3s ease;
        }
        .timer-pulse {
            background: var(--wrong) !important;
            animation: pulse-animation 0.6s infinite alternate;
            transform: scale(1.1);
        }
        @keyframes pulse-animation {
            from { transform: scale(1.1); box-shadow: 0 0 10px var(--wrong); }
            to { transform: scale(1.25); box-shadow: 0 0 25px var(--wrong); }
        }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .option { padding: 18px; border: 2px solid #f0f0f0; border-radius: 15px; cursor: pointer; transition: 0.3s; font-weight: bold; background: #fafafa; font-size: 1.1rem; text-align: center; }
        .option:hover { border-color: var(--primary); background: #f1f2f6; transform: translateY(-2px); }
        
        .correct-opt { background: var(--correct) !important; color: white; border-color: var(--correct) !important; }
        .wrong-opt { background: var(--wrong) !important; color: white; border-color: var(--wrong) !important; }
        
        .feedback-box { margin-top: 20px; padding: 20px; border-radius: 15px; background: #fffde7; border-right: 8px solid var(--accent); display: none; font-size: 1.05rem; box-shadow: inset 0 0 10px rgba(0,0,0,0.02); }
        .btn { background: var(--secondary); color: white; padding: 16px 45px; border: none; border-radius: 12px; cursor: pointer; font-size: 1.2rem; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: var(--primary); transform: scale(1.02); }
        
        .result-table { width: 100%; border-collapse: collapse; margin-top: 25px; background: white; }
        .result-table th { background: var(--primary); color: white; padding: 12px; }
        .result-table td { border: 1px solid #ddd; padding: 12px; text-align: center; font-size: 0.9rem; }
        
        .hidden { display: none; }
        .locked { text-align: center; color: red; margin-top: 100px; padding: 50px; border: 5px solid red; background: white; border-radius: 20px; }
    </style>
</head>
<body id="main-body">

<div class="quiz-card" id="quiz-container">
    <div class="header">
        <h3 id="author-name">✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓</h3>
        <h2 id="quiz-title">اختبار التناظر اللفظي - النموذج (27) المطور</h2>
    </div>

    <div id="start-page" style="text-align: center;">
        <p style="font-size: 1.2rem; margin-bottom: 20px;">⏱️ 45 ثانية | 🔀 خلط عشوائي كامل للأسئلة والخيارات | 💡 تحليل منطقي موسع</p>
        <input type="text" id="studentNameInput" placeholder="أدخل اسمك الثلاثي لبدء التحدي..." style="width: 75%; padding: 15px; border-radius: 10px; border: 2px solid #ccc; text-align: center; font-size: 1.1rem; margin-bottom: 20px;">
        <br><button class="btn" onclick="startQuizAction()">ابدأ الاختبار 🚀</button>
    </div>

    <div id="quiz-page" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div id="progress-text" style="font-weight: bold; color: var(--primary);"></div>
            <div id="timer-box" class="timer-container">⏳ المتبقي: <span id="timer-val">45</span> ثانية</div>
        </div>
        <div id="question-display" style="font-size: 1.8rem; text-align: center; margin: 25px 0; font-weight: 800; color: var(--primary); background: #f9f9f9; padding: 25px; border-radius: 20px; border: 1px solid #eee;"></div>
        <div id="options-container" class="options-grid"></div>
        <div id="feedback-display" class="feedback-box"></div>
        <div style="text-align: center; margin-top: 30px;">
            <button id="next-btn" class="btn hidden" onclick="loadNextQuestion()">السؤال التالي ⮕</button>
        </div>
    </div>

    <div id="result-page" class="hidden">
        <div style="text-align: center; padding: 30px; background: #dcdde1; border-radius: 20px; border: 3px solid var(--primary); margin-bottom: 30px;">
            <h2 id="score-display" style="color: var(--primary); margin:0; font-size: 2.5rem;"></h2>
            <p id="student-greeting" style="font-size: 1.2rem; margin-top:10px;"></p>
        </div>
        <table class="result-table">
            <thead>
                <tr>
                    <th>السؤال</th>
                    <th>إجابتك</th>
                    <th>الصحيحة</th>
                    <th>التحليل المنطقي</th>
                </tr>
            </thead>
            <tbody id="summary-body"></tbody>
        </table>
        <div style="text-align: center; margin-top: 40px;">
            <p style="font-weight: bold; color: var(--primary);">✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓</p>
            <button class="btn" onclick="location.reload()">إعادة الاختبار 🔀</button>
        </div>
    </div>
</div>

<script>
    (function protect() {
        const teacher = "عبد العزيز الفيفي";
        setInterval(() => {
            const auth = document.getElementById('author-name');
            if (!auth || !auth.innerText.includes(teacher)) {
                document.getElementById('main-body').innerHTML = '<div class="locked"><h1>⚠️ خرق حماية الملكية</h1><p>هذا العمل ملك للأستاذ عبدالعزيز الفيفي.</p></div>';
            }
        }, 2000);
    })();

    const questionsPool = [
        { q: "صاروخ : فضاء", c: "غواصة : ماء", a: ["فم : سواك", "أنف : إنسان", "غواصة : ماء", "طائر : منقار"], r: "علاقة مكانية (وسط الحركة)؛ الصاروخ يتحرك في الفضاء والغواصة تتحرك في الماء." },
        { q: "جذع : شجرة", c: "إصبع : قدم", a: ["إصبع : قدم", "غصن : ورقة", "نواة : تمرة", "سحاب : مطر"], r: "علاقة جزء من كل؛ الجذع جزء من الشجرة والإصبع جزء من القدم." },
        { q: "خياشيم : سمك", c: "طير : ريش", a: ["طير : ريش", "أرق : سهر", "ليل : نجوم", "صخور : حجر"], r: "علاقة جزء وظيفي أو ميزة؛ الخياشيم للتنفس في السمك والريش يغطي الطير." },
        { q: "اجتهاد : نجاح", c: "زرع : حصد", a: ["نجوم : ظلام", "نواة : زرع", "زرع : حصد", "دراسة : تعب"], r: "علاقة سبب ونتيجة؛ الاجتهاد يؤدي للنجاح والزرع يؤدي للحصد." },
        { q: "جنين : طفل", c: "عجين : خبز", a: ["عجين : خبز", "نطفة : علقة", "يرقة : فراشة", "بذرة : شجرة"], r: "علاقة تدرج ومرحلية؛ الجنين يصبح طفلاً والعجين يصبح خبزاً." },
        { q: "غمد : سيف", c: "مكحلة : ميل", a: ["أسد : عرين", "ظرف : نقود", "مكحلة : ميل", "مساحيق : وجه"], r: "علاقة وعاء ومحتواه (مكان الاستقرار)؛ الغمد للسيف والمكحلة للميل." },
        { q: "يعسوب : نحلة", c: "دجاجة : ديك", a: ["دجاجة : ديك", "النعجة : الحمل", "جمل : بقرة", "يرقة : فراشة"], r: "علاقة فئة (ذكر وأنثى)؛ اليعسوب هو ذكر النحل والديك هو ذكر الدجاج." },
        { q: "ريش : طائر", c: "خروف : صوف", a: ["خروف : صوف", "كثيف : غزير", "قماش : إنسان", "جلد : ثعبان"], r: "علاقة غطاء خارجي؛ الريش يغطي الطائر والصوف يغطي الخروف." },
        { q: "سوق : مشترون", c: "قطار : ركاب", a: ["تلفاز : مشاهدون", "حرب : جيوش", "قطار : ركاب", "مطار : مسافرون"], r: "علاقة مكان وتواجد؛ السوق يتواجد فيه المشترون والقطار يتواجد فيه الركاب." },
        { q: "ريح : عاصف", c: "حرب : ضروس", a: ["حرب : ضروس", "بكاء : نشيج", "نيزك : كوكب", "صحراء : ناقة"], r: "علاقة الموصوف بصفته الشديدة؛ الريح الشديدة عاصف والحرب الشديدة ضروس." },
        { q: "قلم : كتابة", c: "عين : رؤية", a: ["عين : رؤية", "أذن : سماع", "يد : عمل", "قدم : مشي"], r: "علاقة أداة ووظيفتها؛ القلم للكتابة والعين للرؤية." },
        { q: "حليب : جبن", c: "قمح : عجين", a: ["قمح : عجين", "ماء : ثلج", "خشب : طاولة", "بترول : بنزين"], r: "علاقة أصل وتحول؛ الحليب يُصنع منه الجبن والقمح يُصنع منه العجين." },
        { q: "أعلى : أسفل", c: "أظهر : أخفى", a: ["أخضر : أحمر", "أظهر : أخفى", "شمال : شرق", "جديد : متسخ"], r: "علاقة تضاد؛ الأعلى عكسه الأسفل والأظهر عكسه الأخفى." },
        { q: "الجبال : التلال", c: "الجداول : الأنهار", a: ["أسود : أشبال", "الشجرة : النخلة", "الجداول : الأنهار", "الحشرات : نملة"], r: "علاقة فئة واحدة مع فرق الحجم؛ الجبل أكبر من التل والنهر أكبر من الجدول." },
        { q: "ظمأ : عطش", c: "جري : هرولة", a: ["شباب : هرم", "مرض : موت", "فوز : هزيمة", "جري : هرولة"], r: "علاقة ترادف وتدرج؛ الظمأ هو العطش والجري هو الهرولة." },
        { q: "ظمأ : ماء", c: "جهل : علم", a: ["عزاء : مواساة", "قيادة : رخصة", "جهل : علم", "مرض : دواء"], r: "علاقة احتياج؛ الظمآن يحتاج ماء والجاهل يحتاج علماً." },
        { q: "شاعر : قصيدة", c: "صحفي : خبر", a: ["صحفي : خبر", "رسام : رواية", "كاتب : تحقيق", "رواية : كاتب"], r: "علاقة مُنتِج ومُنتَج؛ الشاعر ينتج قصيدة والصحفي ينتج خبراً." },
        { q: "الكف : المنع", c: "اليد : القبض", a: ["اليد : القبض", "النور : الضياء", "القبض : البسط", "شتاء : خريف"], r: "علاقة ترادف وظيفي؛ الكف هو المنع والقبض وظيفة اليد." },
        { q: "حوت : سمك", c: "عنب : شجر", a: ["صيد : بحر", "عنب : شجر", "حيوان : أسد", "ماء : قرش"], r: "علاقة تصنيف؛ الحوت نوع من السمك والعنب يخرج من الشجر." },
        { q: "متكبر : متعالي", c: "سيف : حسام", a: ["سيف : حسام", "كريم : بخيل", "طويل : ممتد", "قوي : شجاع"], r: "علاقة ترادف؛ المتكبر هو المتعالي والحسام هو السيف." },
        { q: "كرسي : مجلس", c: "بحر : سمك", a: ["جمل : صحراء", "بحر : سمك", "سفر : حقيبة", "طالب : فصل"], r: "علاقة مكانية (احتواء)؛ المجلس فيه كرسي والبحر فيه سمك." },
        { q: "قرابة : عم", c: "نثر : قصة", a: ["الجد : الابن", "نثر : قصة", "شعر : أدب", "فاكهة : تفاح"], r: "علاقة فئة ونوع؛ العم نوع من القرابة والقصة نوع من النثر." },
        { q: "ثعبان : زحف", c: "طائرة : طيران", a: ["سكين : قطع", "عصفور : نقر", "طائرة : طيران", "لاعب : مشي"], r: "علاقة الكائن وحركته؛ الثعبان يزحف والطائرة تطير." },
        { q: "المدح : الثناء", c: "العهد : الوعد", a: ["الهرولة : المشي", "العهد : الوعد", "شعر : نثر", "حب : بغض"], r: "علاقة ترادف؛ المدح هو الثناء والعهد هو الوعد." },
        { q: "مسبح : سباحة", c: "مكتبة : قراءة", a: ["مكتبة : قراءة", "مسرح : ممثل", "رعاية : مكتب", "جليد : جبل"], r: "علاقة مكان والنشاط الممارس فيه؛ المسبح للسباحة والمكتبة للقراءة." },
        { q: "طحالب : ماء", c: "رحيق : زهور", a: ["رحيق : زهور", "درج : مكتب", "حصان : فرس", "خيانة : قلب"], r: "علاقة تواجد؛ الطحالب في الماء والرحيق في الزهور." },
        { q: "قرش : سمكة", c: "صقر : حمامة", a: ["صقر : حمامة", "غزال : نمر", "أسد : حيوان", "نجم : فلك"], r: "علاقة فئة (واحد منها)؛ القرش نوع من الأسماك والصقر نوع من الطيور." },
        { q: "ملعقة : طعام", c: "قلم : كتابة", a: ["خوف : اختبار", "عبادة : مسجد", "قلم : كتابة", "مفتاح : باب"], r: "علاقة أداة ووظيفة؛ الملعقة للطعام والقلم للكتابة." },
        { q: "فصل : طالب", c: "عيادة : طبيب", a: ["معلم : مدرسة", "مكتب : تلفاز", "طائر : منقار", "عيادة : طبيب"], r: "علاقة مكانية وتواجد؛ الفصل فيه طالب والعيادة فيها طبيب. ✨ أ / عبد العزيز الفيفي 🎓" }
    ];

    let currentIdx = 0, score = 0, timer, timeLeft = 45, logs = [], activePool = [], studentName = "";

    function startQuizAction() {
        studentName = document.getElementById('studentNameInput').value;
        if (!studentName.trim()) { alert("يرجى كتابة الاسم الثلاثي لبدء التحدي"); return; }
        activePool = [...questionsPool].sort(() => Math.random() - 0.5); // خلط الأسئلة
        document.getElementById('start-page').classList.add('hidden');
        document.getElementById('quiz-page').classList.remove('hidden');
        document.getElementById('student-greeting').innerText = "بالتوفيق يا بطل: " + studentName;
        loadQuestion();
    }

    function startTimer() {
        clearInterval(timer); timeLeft = 45;
        const tBox = document.getElementById('timer-box');
        const tVal = document.getElementById('timer-val');
        tBox.classList.remove('timer-pulse');
        tVal.innerText = timeLeft;
        timer = setInterval(() => {
            timeLeft--; tVal.innerText = timeLeft;
            if (timeLeft <= 5) tBox.classList.add('timer-pulse');
            if (timeLeft <= 0) { clearInterval(timer); handleAns(null, null); }
        }, 1000);
    }

    function loadQuestion() {
        if (currentIdx >= activePool.length) { endQuiz(); return; }
        const q = activePool[currentIdx];
        document.getElementById('progress-text').innerText = `سؤال ${currentIdx + 1} من ${activePool.length}`;
        document.getElementById('question-display').innerText = q.q;
        document.getElementById('feedback-display').style.display = 'none';
        document.getElementById('next-btn').classList.add('hidden');
        const box = document.getElementById('options-container'); box.innerHTML = '';
        [...q.a].sort(() => Math.random() - 0.5).forEach(opt => {
            const div = document.createElement('div'); div.className = 'option'; div.innerText = opt;
            div.onclick = () => handleAns(opt, div); box.appendChild(div);
        });
        startTimer();
    }

    function handleAns(sel, el) {
        clearInterval(timer);
        document.getElementById('timer-box').classList.remove('timer-pulse');
        const q = activePool[currentIdx];
        const opts = document.querySelectorAll('.option');
        opts.forEach(o => o.onclick = null);
        let isCorrect = (sel === q.c);
        if (isCorrect) { if(el) el.classList.add('correct-opt'); score++; }
        else { if(el) el.classList.add('wrong-opt'); opts.forEach(o => { if(o.innerText === q.c) o.classList.add('correct-opt'); }); }
        const fb = document.getElementById('feedback-display'); fb.style.display = 'block';
        fb.innerHTML = `<strong>💡 التحليل:</strong> ${q.r}<br><br><small>✨ أ / عبد العزيز الفيفي - ثانوية الأمير عبدالمجيد 🎓</small>`;
        document.getElementById('next-btn').classList.remove('hidden');
        logs.push({ q: q.q, user: sel || "انتهى الوقت ⏰", correct: q.c, r: q.r });
    }

    function loadNextQuestion() { currentIdx++; loadQuestion(); }

    function endQuiz() {
        document.getElementById('quiz-page').classList.add('hidden');
        document.getElementById('result-page').classList.remove('hidden');
        document.getElementById('score-display').innerText = `النتيجة النهائية: ${score} من ${activePool.length}`;
        const tbody = document.getElementById('summary-body');
        logs.forEach(l => {
            tbody.innerHTML += `<tr><td>${l.q}</td><td style="color:${l.user === l.correct ? 'green':'red'}">${l.user}</td><td style="color:green; font-weight:bold">${l.correct}</td><td style="text-align:right">${l.r}</td></tr>`;
        });
    }
</script>
</body>
</html>
